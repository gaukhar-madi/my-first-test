plugins {
    id 'java'
    id 'io.qameta.allure' version '4.1.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {

    testImplementation 'com.codeborne:selenide:7.7.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.github.javafaker:javafaker:1.0.2'
    testImplementation 'io.qameta.allure:allure-junit5:2.33.0'
    testImplementation 'io.qameta.allure:allure-selenide:2.33.0'
    testImplementation 'org.aeonbits.owner:owner:1.0.12'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

compileTestJava {
    options.compilerArgs += '-parameters'
}

allure {
    version = "2.33.0"
    adapter {
        frameworks {
            junit5 {
                enabled = true
            }
        }
    }
}

tasks.withType(Test) {
    useJUnitPlatform()
    ignoreFailures = true

    // Пробрасываем параметры из командной строки (-Dbrowser=... и т.д.) в форкнутую тест-JVM
    ['baseUrl', 'remoteUrl', 'browser', 'browserVersion', 'browserSize', 'headless'].each { key ->
        if (System.getProperty(key) != null) {
            systemProperty key, System.getProperty(key)
        }
    }

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}
